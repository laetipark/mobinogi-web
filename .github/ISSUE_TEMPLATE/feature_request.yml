name: Feature request
description: Suggest an enhancement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior or API/UI change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've considered
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Affected modules (backend/frontend/deploy), migration risk, etc.
    validations:
      required: false
