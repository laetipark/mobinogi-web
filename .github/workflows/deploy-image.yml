name: Build And Deploy Image

on:
    push:
        branches:
            - main
            - master
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_REPOSITORY: ${{ github.repository_owner }}/mobinogi-web

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            image_ref: ${{ steps.image.outputs.image_ref }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            
            -   name: Set up Java 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '21'
                    cache: maven
            
            -   name: Build WAR
                shell: bash
                run: |
                    chmod +x ./mvnw
                    ./mvnw -DskipTests clean package
                    war_count=$(ls -1 target/*.war | wc -l)
                    [ "$war_count" -eq 1 ]
            
            -   name: Prepare image tags
                id: image
                shell: bash
                run: |
                    IMAGE_BASE="$(echo "${REGISTRY}/${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
                    IMAGE_REF="${IMAGE_BASE}:${GITHUB_SHA}"
                    echo "image_base=${IMAGE_BASE}" >> "${GITHUB_OUTPUT}"
                    echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"
            
            -   name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Set up Docker Buildx
                id: buildx
                uses: docker/setup-buildx-action@v3
                with:
                    driver: docker-container
            
            -   name: Build and push
                uses: docker/build-push-action@v6
                with:
                    builder: ${{ steps.buildx.outputs.name }}
                    context: .
                    push: true
                    tags: |
                        ${{ steps.image.outputs.image_ref }}
                        ${{ steps.image.outputs.image_base }}:latest
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
    
    deploy:
        runs-on: [self-hosted, Linux, X64]
        needs: build-and-push
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        steps:
            -   name: Deploy on self-hosted runner
                shell: bash
                env:
                    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
                run: |
                    set -euo pipefail
                    TARGET_PATH="${DEPLOY_PATH:-/home/laeti/mobinogi}"
                    cd "${TARGET_PATH}"
                    echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
                    APP_IMAGE="${{ needs.build-and-push.outputs.image_ref }}"
                    export APP_IMAGE
                    docker compose -f docker-compose.yml pull app
                    docker compose -f docker-compose.yml up -d --remove-orphans app
                    docker image prune -f
