# server
server.address=0.0.0.0
server.port=${SERVER_PORT:50620}
spring.application.name=mobinogi
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}
spring.config.import=optional:file:./.env[.properties],optional:file:./config/.env[.properties],optional:file:../.env[.properties],optional:file:../config/.env[.properties],optional:file:./mobinogi-web/.env[.properties],optional:file:./mobinogi-web/config/.env[.properties],optional:file:../mobinogi-web/.env[.properties],optional:file:../mobinogi-web/config/.env[.properties]

# mysql database connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mobinogi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# redis
redis.host=${REDIS_HOST:172.30.1.7}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.database=${REDIS_DATABASE:0}
# redis health check (optional - disable if Redis not available)
management.health.redis.enabled=false
spring.data.redis.timeout=2000ms
# app
app.url=${APP_URL:https://laetipark.me}
spring.jackson.time-zone=${TZ:Asia/Seoul}
spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:Asia/Seoul}
# rank api
rank.api.base=${RANK_API_BASE:}
rank.api.connect-timeout-ms=${RANK_API_CONNECT_TIMEOUT_MS:3000}
rank.api.read-timeout-ms=${RANK_API_READ_TIMEOUT_MS:8000}
rank.api.failure-cooldown-ms=${RANK_API_FAILURE_COOLDOWN_MS:30000}
guild.refresh.status.ttl-seconds=${GUILD_REFRESH_STATUS_TTL_SECONDS:3600}
guild.refresh.status.backend-redis-enabled=${GUILD_REFRESH_STATUS_BACKEND_REDIS_ENABLED:false}
# event ending summary board post scheduler
event.ending-summary.enabled=${EVENT_ENDING_SUMMARY_ENABLED:true}
event.ending-summary.cron=${EVENT_ENDING_SUMMARY_CRON:0 0 * * * *}
event.ending-summary.days-before-end=${EVENT_ENDING_SUMMARY_DAYS_BEFORE_END:2}
event.ending-summary.author=${EVENT_ENDING_SUMMARY_AUTHOR:\uC139\uC2DC\uBD07}
# JWT settings
jwt.secret=${JWT_SECRET:mobinogi-jwt-secret-key-that-should-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}
# File upload
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=100MB
# SFTP (file storage server)
sftp.host=${SFTP_HOST:}
sftp.port=${SFTP_PORT:}
sftp.username=${SFTP_USERNAME:}
sftp.password=${SFTP_PASSWORD:}
sftp.remote-path=${SFTP_REMOTE_PATH:}
