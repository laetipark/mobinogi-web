# server
server.address=0.0.0.0
server.port=${SERVER_PORT}
spring.application.name=mobinogi
# mysql database connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# google api
google.sheets.credentials.path=${GOOGLE_SHEETS_CREDENTIALS_PATH}
google.sheets.id=${GOOGLE_SHEETS_ID}
# notion api
notion.api.token=${NOTION_API_TOKEN}
notion.database.id=${NOTION_DATABASE_ID}
notion.sync.enabled=${NOTION_SYNC_ENABLED:true}
# discord api
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
discord.bot.token=${DISCORD_BOT_TOKEN:}
discord.text.channel.ids=${DISCORD_TEXT_CHANNEL_IDS:}
discord.forum.channel.ids=${DISCORD_FORUM_CHANNEL_IDS:}
# app
app.url=${APP_URL:http://localhost:3000}
# JWT settings
jwt.secret=${JWT_SECRET:mobinogi-jwt-secret-key-that-should-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}
