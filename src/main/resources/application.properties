# server
server.address=0.0.0.0
server.port=${SERVER_PORT}
spring.application.name=mobinogi
# mysql database connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# redis
redis.host=${REDIS_HOST:172.30.1.7}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.database=${REDIS_DATABASE:0}
# redis health check (optional - disable if Redis not available)
management.health.redis.enabled=false
spring.data.redis.timeout=2000ms
# discord webhook (used by Spring Boot for new post notifications)
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
# discord bot
discord.bot.token=${DISCORD_BOT_TOKEN:}
# discord oauth2
discord.oauth.client-id=${DISCORD_OAUTH_CLIENT_ID:}
discord.oauth.client-secret=${DISCORD_OAUTH_CLIENT_SECRET:}
discord.oauth.redirect-uri=${DISCORD_OAUTH_REDIRECT_URI:}
# app
app.url=${APP_URL:http://localhost:3000}
# JWT settings
jwt.secret=${JWT_SECRET:mobinogi-jwt-secret-key-that-should-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}
# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# SFTP (file storage server)
sftp.host=${SFTP_HOST:}
sftp.port=${SFTP_PORT:}
sftp.username=${SFTP_USERNAME:}
sftp.password=${SFTP_PASSWORD:}
sftp.remote-path=${SFTP_REMOTE_PATH:}
